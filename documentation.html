    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --accent-primary: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --color-get: #10b981;
            --color-post: #3b82f6;
            --color-put: #f59e0b;
            --color-delete: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }

        /* Sidebar styling */
        aside {
            width: 320px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100%;
        }

        .brand {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 8px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
        }

        .nav-sections {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .nav-category {
            margin-bottom: 24px;
        }

        .nav-category-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-left: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-tertiary);
            color: #fff;
        }

        .nav-item.active {
            border-left: 3px solid var(--accent-primary);
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        /* Main Workspace Panel */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .header-meta {
            display: flex;
            gap: 16px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-color: var(--bg-primary);
        }

        .intro-section {
            margin-bottom: 40px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05) 0%, rgba(17, 24, 39, 0.5) 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }

        .intro-section h2 {
            margin-bottom: 12px;
            font-size: 1.4rem;
        }

        .intro-section p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* Cards and List layout */
        .api-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .api-card-header {
            padding: 16px 24px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .api-card-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .method-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-align: center;
            min-width: 70px;
        }

        .method-GET {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--color-get);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .method-POST {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--color-post);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .method-PUT {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--color-put);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .method-DELETE {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--color-delete);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .api-route-path {
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .api-action-name {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .api-card-details {
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            border-top: 1px solid var(--border-color);
        }

        .api-info-panel h4 {
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .param-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .param-table th, .param-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .param-table th {
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* Code block container */
        .code-container {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            position: relative;
            max-height: 250px;
            overflow-y: auto;
        }

        .code-block {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #34d399;
            white-space: pre-wrap;
        }

        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background-color: var(--accent-primary);
        }

        /* Table styles for seeding */
        .seeding-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
        }

        .seeding-table th, .seeding-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .seeding-table th {
            background-color: var(--bg-secondary);
            font-weight: 600;
        }
    </style>
</head>

        // Render Sidebar Navigation
        function initNav() {
            const superadminList = document.getElementById('superadmin-nav-list');
            const companyList = document.getElementById('company-nav-list');

            superadminList.innerHTML = '';
            companyList.innerHTML = '';

            apiData.controllers.forEach(c => {
                if (c.name === 'DocumentsController') return; // Rendered statically
                
                const item = document.createElement('div');
                item.className = 'nav-item';
                item.textContent = c.clean_name;
                item.onclick = () => showControllerDetails(c.name);

                if (apiData.superadmin_list.includes(c.name)) {
                    superadminList.appendChild(item);
                } else {
                    companyList.appendChild(item);
                }
            });
        }

        // Display introductory details
        function showIntro() {
            const area = document.getElementById('contentArea');
            document.getElementById('headerTitle').textContent = 'API Integration Introduction';
            
            area.innerHTML = `
                <div class="intro-section">
                    <h2>API Base & Routing</h2>
                    <p>All platform APIs are hosted locally or on test environments on port <strong>5000 (HTTP)</strong> / <strong>5001 (HTTPS)</strong>.</p>
                    <p>The system splits APIs into two distinct OpenApi document scopes: <strong>SuperAdmin</strong> (platform-wide registry, key rotation, system metrics) and <strong>Company</strong> (tenant accounts, user auth, branch fiscal years).</p>
                </div>

                <div class="intro-section" style="border-left: 4px solid var(--accent-primary)">
                    <h2>JWT Bearer Authentication</h2>
                    <p>To access authenticated routes, retrieve a token using the credentials endpoint. Send the token inside the HTTP Headers:</p>
                    <div class="code-container" style="max-height: 120px;">
                        <span class="code-block">Authorization: Bearer &lt;your_jwt_token&gt;</span>
                    </div>
                </div>

                <div class="intro-section">
                    <h2>Global Response Envelope</h2>
                    <p>Every response returned by the API is packed into a standard envelope layout:</p>
                    <div class="code-container">
                        <span class="code-block">${JSON.stringify({
                            "success": true,
                            "message": "Operation completed successfully.",
                            "data": { "id": 12, "details": "..." },
                            "statusCode": 200,
                            "errors": null
                        }, null, 2)}</span>
                    </div>
                </div>
            `;
            setActiveNavItem('intro');
        }

                                <td><strong>3</strong></td>
                                <td>SuperAdmin</td>
                                <td>المشرف العام</td>
                                <td>Super Admin</td>
                                <td>Personal system attachments</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
            setActiveNavItem('owner-types');
        }

        function showControllerDetails(name) {
            currentControllerName = name;
            currentSection = 'controller';
            setActiveNavItem(null);
            
            const controller = apiData.controllers.find(c => c.name === name);
            if (!controller) return;

            document.getElementById('headerTitle').textContent = controller.clean_name + ' Controller Endpoints';
            const area = document.getElementById('contentArea');
            
            let html = `
                <div class="intro-section" style="margin-bottom: 24px;">
                    <h2>${controller.clean_name} Controller</h2>
                    <p>Route Prefix: <code>/${controller.base_route}</code></p>
                    <p>Access Policy: <code>${controller.class_auth || 'None'}</code></p>
                </div>
            `;

            if (controller.methods.length === 0) {
                html += '<p>No actions available in this controller.</p>';
            } else {
                controller.methods.forEach((m, idx) => {
                    let payloadStr = m.payload ? JSON.stringify(m.payload, null, 2) : '// No body payload required';
                    if (typeof m.payload === 'string') payloadStr = m.payload;
                    
                    html += `
                        <div class="api-card">
                            <div class="api-card-header" onclick="toggleDetails('card-details-${idx}')">
                                <div class="api-card-title-group">
                                    <span class="method-badge method-${m.verb}">${m.verb}</span>
                                    <span class="api-route-path">${m.path}</span>
                                </div>
                                <span class="api-action-name">${m.name || 'Anonymous Action'}</span>
                            </div>
                            <div class="api-card-details" id="card-details-${idx}">
                                <div class="api-info-panel">
                                    <h4>Action Parameters</h4>
                                    <div style="margin-bottom: 16px;">
                                        <p style="font-size: 0.9rem; color: var(--text-secondary);">Method Parameters:</p>
                                        <code style="font-size: 0.85rem; font-family: 'Fira Code', monospace; color: #f59e0b;">${m.params || 'None'}</code>
                                    </div>
                                    <div style="margin-bottom: 16px;">
                                        <p style="font-size: 0.9rem; color: var(--text-secondary);">Access Requirement:</p>
                                        <span class="badge" style="margin-top: 4px; display: inline-block;">${m.auth}</span>
                                    </div>
                                </div>
                                
                                <div class="api-info-panel">
                                    <h4>JSON Request Payload / Scheme</h4>
                                    <div class="code-container">
                                        <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                                        <pre class="code-block">${payloadStr}</pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            area.innerHTML = html;
        }

        function toggleDetails(id) {
            const el = document.getElementById(id);
            if (el.style.display === 'none' || !el.style.display) {
                el.style.display = 'grid';
            } else {
                el.style.display = 'none';
            }
        }

        function copyCode(btn) {
            const text = btn.nextElementSibling.textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
            });
        }

        function setActiveNavItem(selector) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (selector && item.textContent.trim().toLowerCase().includes(selector.toLowerCase())) {
                    item.classList.add('active');
                }
            });
        }

        function showSection(section) {
            currentSection = section;
            currentControllerName = null;
            if (section === 'intro') showIntro();
            if (section === 'owner-types') showOwnerTypes();
        }

        // Dynamic Filtering across all routes and controllers
        function filterApis() {
            const searchStr = document.getElementById('searchBox').value.toLowerCase();
            if (!searchStr) {
                initNav();
                return;
            }

            const superadminList = document.getElementById('superadmin-nav-list');
            const companyList = document.getElementById('company-nav-list');

            superadminList.innerHTML = '';
            companyList.innerHTML = '';

            apiData.controllers.forEach(c => {
                // Check match
                const controllerMatch = c.clean_name.toLowerCase().includes(searchStr);
                const routeMatch = c.methods.some(m => m.path.toLowerCase().includes(searchStr) || m.name.toLowerCase().includes(searchStr));

                if (controllerMatch || routeMatch) {
                    const item = document.createElement('div');
                    item.className = 'nav-item';
                    item.textContent = c.clean_name;
                    item.onclick = () => showControllerDetails(c.name);

                    if (apiData.superadmin_list.includes(c.name)) {
                        superadminList.appendChild(item);
                    } else {
                        companyList.appendChild(item);
                    }
                }
            });
        }

        // Bootstrap UI Portal
        initNav();
        showIntro();
    </script>
</body>
</html>
